rules:
  - id: kernelspy-sql-injection-concat
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Potential SQL injection via dynamic query construction.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $DB.execute("..." + $X)
          - pattern: $DB.execute(f"...{$X}...")
          - pattern: $DB.query(`...${$X}...`)
          - pattern: $DB.raw("..." + $X)
          - pattern: $DB.execute($QUERY)
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?i)(query|sql|statement)

  - id: kernelspy-command-injection
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Potential OS command injection through shell execution.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: os.system("..." + $X)
          - pattern: subprocess.call("..." + $X, shell=True)
          - pattern: Runtime.getRuntime().exec("..." + $X)
          - pattern: Process.Start("..." + $X)
          - pattern: eval($X)

  - id: kernelspy-command-injection-variable
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: "Potential OS command injection: command name comes from a variable."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: subprocess.call($CMD, shell=True)
          - pattern: Process.Start($CMD)
          - pattern: exec($CMD)
      - metavariable-regex:
          metavariable: $CMD
          regex: (?i).*(user|input|param|cmd|command|arg).*

  - id: kernelspy-xss-dom-sink
    languages: [javascript, typescript]
    message: "Potential DOM XSS: untrusted value written to an HTML sink."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write($X)
          - pattern: $EL.insertAdjacentHTML($POS, $X)

  - id: kernelspy-hardcoded-secret
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Possible hardcoded credential or API secret.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $KEY = "..."
          - pattern: $KEY = '...'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|secret|api_?key|token|credential).*

  - id: kernelspy-config-secret
    languages: [yaml, json]
    message: Possible credential stored in configuration.
    severity: WARNING
    patterns:
      - pattern: "$KEY: $VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|secret|api_?key|token|credential).*

  - id: kernelspy-weak-crypto
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Weak cryptographic algorithm detected (MD5/SHA1).
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MD5.Create()

  - id: kernelspy-path-traversal
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Potential path traversal through unsanitized file path.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: open("..." + $X)
          - pattern: File.ReadAllText("..." + $X)
          - pattern: fs.readFileSync("..." + $X)

  - id: kernelspy-ssrf-user-input
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: "Potential SSRF: request target derived from user-controlled input."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: requests.get($URL)
          - pattern: requests.post($URL)
          - pattern: fetch($URL)
          - pattern: urllib.request.urlopen($URL)
      - metavariable-regex:
          metavariable: $URL
          regex: (?i).*(user|input|param|query|target|url|href).*

  - id: kernelspy-xxe
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Potential XML external entity (XXE) processing.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: DtdProcessing.Parse
          - pattern: resolve_entities=True
          - pattern: XmlResolver = $X
          - pattern: libxml_disable_entity_loader(false)

  - id: kernelspy-insecure-deserialization
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Potential insecure deserialization of untrusted data.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: pickle.loads($X)
          - pattern: yaml.load($X)
          - pattern: unserialize($X)

  - id: kernelspy-insecure-deserialization-csharp
    languages: [csharp]
    message: Potential insecure deserialization of untrusted data.
    severity: ERROR
    patterns:
      - pattern: new BinaryFormatter()

  - id: kernelspy-open-redirect
    languages: [python, javascript, typescript, java, csharp, php, ruby, go]
    message: Potential open redirect using user-controlled target.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: Response.Redirect($URL)
          - pattern: window.location = $URL
          - pattern: location.href = $URL
      - metavariable-regex:
          metavariable: $URL
          regex: (?i).*(user|input|param|query|request|req).*
